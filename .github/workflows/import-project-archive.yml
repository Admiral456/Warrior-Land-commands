name: Build WarriorLand Command Unlocks from current source

on:
  push:
    branches: [main]
    paths:
      - 'latest-source-upgrade/part01.b64'
      - 'latest-source-upgrade/part02.b64'
      - 'latest-source-upgrade/part03a.b64'
      - 'latest-source-upgrade/part03b.b64'
      - 'latest-source-upgrade/part04.b64'
      - 'latest-source-upgrade/part05.b64'
      - 'latest-source-upgrade/part06.b64'
      - 'latest-source-upgrade/part07a.b64'
      - 'latest-source-upgrade/part07b.b64'
      - 'latest-source-upgrade/default-skin.png.b64'
      - '.github/workflows/import-project-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract baseline source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/WarriorLand-Commands-1.15.8.zip"
          test -s "$ARCHIVE"
          DEST="$RUNNER_TEMP/warriorland-source"
          mkdir -p "$DEST"
          unzip -q "$ARCHIVE" -d "$DEST"
          SOURCE_DIR="$DEST/WarriorLandCommandUnlocks-1.15.8"
          test -f "$SOURCE_DIR/build.gradle.kts"
          test -f "$SOURCE_DIR/web/index.html"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Apply current project source patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64="$RUNNER_TEMP/warriorland-patch.b64"
          PATCH_FILE="$RUNNER_TEMP/warriorland-upgrade.patch"
          cat \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part01.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part02.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part03a.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part03b.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part04.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part05.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part06.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part07a.b64" \
            "$GITHUB_WORKSPACE/latest-source-upgrade/part07b.b64" > "$PATCH_B64"
          base64 -d "$PATCH_B64" | gunzip -c > "$PATCH_FILE"
          cd "$SOURCE_DIR"
          patch --batch --forward -p2 < "$PATCH_FILE"
          mkdir -p web/assets/branding
          base64 -d "$GITHUB_WORKSPACE/latest-source-upgrade/default-skin.png.b64" > web/assets/branding/warriorland-default-skin.png
          test -s web/assets/branding/warriorland-default-skin.png
          grep -q 'class WebApiServer' src/main/java/cz/warriorland/commandunlocks/WebApiServer.java
          grep -q 'class WebAuthService' src/main/java/cz/warriorland/commandunlocks/WebAuthService.java

      - name: Ensure JUnit Platform launcher is available
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          launcher = 'testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.12.2")'
          if launcher not in source:
              needle = 'testImplementation("org.junit.jupiter:junit-jupiter:5.12.2")'
              if needle not in source:
                  raise SystemExit("Could not find the JUnit Jupiter dependency declaration.")
              source = source.replace(needle, needle + "\\n    " + launcher, 1)
              path.write_text(source, encoding="utf-8")
          PY
          grep -q 'junit-platform-launcher:1.12.2' build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Pillow

      - name: Align web branding validation with SVG logo
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_web_preview.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace("assets/branding/warriorland-logo.webp", "assets/branding/warriorland-logo.svg")
          source = source.replace("'warriorland-logo.webp' in html", "'warriorland-logo.svg' in html")
          source = source.replace(
              '    logo = Image.open(WEB / "assets/branding/warriorland-logo.svg")\\n'
              '    skin = Image.open(WEB / "assets/branding/warriorland-default-skin.png")\\n'
              '    check(logo.width >= 800 and logo.height >= 250, f"server logo dimensions look wrong: {logo.size}")',
              '    from xml.etree import ElementTree\\n'
              '    logo = ElementTree.parse(WEB / "assets/branding/warriorland-logo.svg").getroot()\\n'
              '    check(logo.attrib.get("viewBox") == "0 0 240 240", "server logo SVG has an unexpected viewBox")\\n'
              '    skin = Image.open(WEB / "assets/branding/warriorland-default-skin.png")'
          )
          path.write_text(source, encoding="utf-8")
          PY
          grep -q 'warriorland-logo.svg' scripts/validate_web_preview.py

      - name: Validate current project
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          python scripts/generate_resource_pack_icons.py
          python scripts/generate_command_icon_states.py
          python scripts/generate_itemsadder_gui_background.py
          python scripts/render_source_preview.py
          python scripts/export_web_catalog.py
          python scripts/validate_web_preview.py
          python scripts/validate_project.py
          python scripts/validate_server_only.py

      - name: Build plugin and run JUnit tests
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle clean test build --warning-mode all

      - name: Verify current plugin JAR
        working-directory: ${{ env.SOURCE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/WarriorLandCommandUnlocks-1.15.8.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -x 'plugin.yml' >/dev/null
          jar tf "$JAR" | grep -x 'config.yml' >/dev/null
          jar tf "$JAR" | grep -x 'cz/warriorland/commandunlocks/CommandUnlocksPlugin.class' >/dev/null
          jar tf "$JAR" | grep -x 'cz/warriorland/commandunlocks/WebApiServer.class' >/dev/null
          jar tf "$JAR" | grep -x 'cz/warriorland/commandunlocks/WebAuthService.class' >/dev/null
          jar tf "$JAR" | grep -x 'cz/warriorland/commandunlocks/UpdateAnnouncementPolicy.class' >/dev/null

      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLandCommandUnlocks-1.15.8-JAR
          path: ${{ env.SOURCE_DIR }}/build/libs/WarriorLandCommandUnlocks-1.15.8.jar
          if-no-files-found: error
          retention-days: 14
